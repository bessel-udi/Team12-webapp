openapi: 3.0.0
info:
  title: QuickFundi API
  version: 1.0.0
  description: >
    API exposed by Team 12 (QuickFundi) for Team 13 (HospitalQ) to search
    fundis, view their profiles, and manage facility-maintenance bookings.


    Every request must include a valid API key in the `X-API-Key` header.
    Keys are issued privately, one per consumer. Each key is limited to 100
    requests per minute; exceeding the limit returns 429 with a `Retry-After`
    header.

servers:
  - url: https://team12-webapp-production.up.railway.app
    description: Production (Railway)
  - url: http://localhost:5000
    description: Local development

security:
  - ApiKeyAuth: []

paths:
  /workers:
    get:
      summary: Search worker profiles by job type and location
      parameters:
        - name: jobType
          in: query
          required: false
          schema:
            type: string
            enum: [electrician, plumber, handyman]
          example: electrician
        - name: location
          in: query
          required: false
          schema:
            type: string
          example: "Nairobi, Upper Hill"
      responses:
        '200':
          description: A list of workers matching the search criteria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkerSummary'
              example:
                - id: "wk_1042"
                  name: "James Otieno"
                  jobType: "electrician"
                  location: "Nairobi, Upper Hill"
                  rating: 4.8
                  ratePerHour: 800
        '400':
          description: Missing or invalid query parameters (each filter must be a single value)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "INVALID_QUERY"
                message: "jobType and location must be single values"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /workers/{id}:
    get:
      summary: Retrieve a single worker's skill profile, rate card, and reviews
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "wk_1042"
      responses:
        '200':
          description: Full worker profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerProfile'
              example:
                id: "wk_1042"
                name: "James Otieno"
                jobType: "electrician"
                location: "Nairobi, Upper Hill"
                experienceYears: 6
                ratePerHour: 800
                rating: 4.8
                reviews:
                  - author: "Grace M."
                    comment: "Fixed our wiring fault quickly."
                    rating: 5
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No worker exists with the given id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "WORKER_NOT_FOUND"
                message: "No worker found with id wk_1042"
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /bookings:
    post:
      summary: Create a booking for a worker to attend a facility-maintenance job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
            example:
              workerId: "wk_1042"
              jobType: "electrician"
              location: "Nairobi Hospital, Ward 4"
              scheduledFor: "2026-09-15T09:00:00Z"
              requestedBy: "HospitalQ Facilities Desk"
      responses:
        '201':
          description: Booking created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              example:
                id: "bk_9f2a41c7d3b8e605"
                workerId: "wk_1042"
                jobType: "electrician"
                location: "Nairobi Hospital, Ward 4"
                scheduledFor: "2026-09-15T09:00:00Z"
                status: "pending"
                createdAt: "2026-09-07T08:00:00Z"
        '400':
          description: Request body missing required fields, not valid JSON, or fields not strings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "INVALID_BOOKING"
                message: "scheduledFor must be a valid ISO 8601 date-time"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The requested worker is not available at the requested time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "WORKER_UNAVAILABLE"
                message: "Worker wk_1042 already has a booking at this time"
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /bookings/{id}:
    get:
      summary: Check the current status of a booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "bk_9f2a41c7d3b8e605"
      responses:
        '200':
          description: Current booking details and status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              example:
                id: "bk_9f2a41c7d3b8e605"
                workerId: "wk_1042"
                jobType: "electrician"
                location: "Nairobi Hospital, Ward 4"
                scheduledFor: "2026-09-15T09:00:00Z"
                status: "in_progress"
                createdAt: "2026-09-07T08:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No booking exists with the given id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "BOOKING_NOT_FOUND"
                message: "No booking found with id bk_9f2a41c7d3b8e605"
        '429':
          $ref: '#/components/responses/TooManyRequests'

    patch:
      summary: Reschedule an existing booking's date/time
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "bk_9f2a41c7d3b8e605"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduledFor]
              properties:
                scheduledFor:
                  type: string
                  format: date-time
                  example: "2026-09-16T09:00:00Z"
      responses:
        '200':
          description: Booking rescheduled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              example:
                id: "bk_9f2a41c7d3b8e605"
                workerId: "wk_1042"
                jobType: "electrician"
                location: "Nairobi Hospital, Ward 4"
                scheduledFor: "2026-09-16T09:00:00Z"
                status: "pending"
                createdAt: "2026-09-07T08:00:00Z"
        '400':
          description: New scheduledFor value missing or malformed, or body not valid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "INVALID_RESCHEDULE"
                message: "scheduledFor must be a valid date-time"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No booking exists with the given id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "BOOKING_NOT_FOUND"
                message: "No booking found with id bk_9f2a41c7d3b8e605"
        '409':
          description: Booking cannot be rescheduled in its current status (e.g. already completed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "BOOKING_NOT_RESCHEDULABLE"
                message: "Booking bk_9f2a41c7d3b8e605 is already completed and cannot be rescheduled"
        '429':
          $ref: '#/components/responses/TooManyRequests'

    delete:
      summary: Cancel an existing booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "bk_9f2a41c7d3b8e605"
      responses:
        '204':
          description: Booking cancelled successfully, no content returned
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No booking exists with the given id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "BOOKING_NOT_FOUND"
                message: "No booking found with id bk_9f2a41c7d3b8e605"
        '409':
          description: Booking cannot be cancelled in its current status (e.g. already completed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "BOOKING_NOT_CANCELLABLE"
                message: "Booking bk_9f2a41c7d3b8e605 is already completed and cannot be cancelled"
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /staff/login:
    post:
      summary: Staff sign in (admin or fundi)
      description: Limited to 8 attempts per minute per address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffLoginRequest' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffLoginResponse' }
        '400':
          description: Username or password missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }
        '401':
          description: Invalid username or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }
              example: { message: "Invalid username or password" }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Staff login is not configured on the server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }

  /staff:
    post:
      summary: Create a staff account (admin only)
      security:
        - StaffBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffCreateRequest' }
      responses:
        '201':
          description: Account created
        '400':
          description: Invalid username, name, role or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }
              example: { message: "Please sign in" }
        '403':
          description: Signed in, but not an admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }
        '409':
          description: Username already taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }

  /staff/activity:
    get:
      summary: Latest takes and returns (admin only)
      security:
        - StaffBearer: []
      responses:
        '200':
          description: The 30 most recent changes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ActivityEntry' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }
        '403':
          description: Signed in, but not an admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }

  /provider-inventory/{id}:
    get:
      summary: Materials in stock (staff only)
      description: >
        Partner stock minus what staff currently hold. Customers cannot see
        this: a signed-in admin or fundi is required.
      security:
        - StaffBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          example: 15
      responses:
        '200':
          description: Current materials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryResponse' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }
        '403':
          description: Account not allowed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }
        '502':
          description: Partner data unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }

  /provider-inventory/{id}/take:
    post:
      summary: Take materials (staff only)
      security:
        - StaffBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          example: 15
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TakeReturnRequest' }
      responses:
        '200':
          description: Taken; returns the updated list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryResponse' }
        '400':
          description: productId and quantity must be whole numbers (quantity 1-100)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }
        '404':
          description: No such item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Not enough stock left (NOT_ENOUGH_STOCK)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Live stock unavailable, so nothing can be taken right now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /provider-inventory/{id}/return:
    post:
      summary: Return materials (staff only)
      description: >
        A fundi can return only what they took themselves (NOT_YOURS).
        An admin can return on anyone's behalf.
      security:
        - StaffBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          example: 15
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TakeReturnRequest' }
      responses:
        '200':
          description: Returned; returns the updated list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryResponse' }
        '400':
          description: productId and quantity must be whole numbers (quantity 1-100)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }
        '404':
          description: No such item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Returning more than is held (NOT_YOURS or RETURN_TOO_MANY)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Live stock unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        API key issued privately to each consumer. Send it in the X-API-Key
        header on every request.
   
    StaffBearer:
      type: http
      scheme: bearer
      description: >
        Session token returned by POST /staff/login (valid for 8 hours).
        Send it as `Authorization: Bearer <token>`. Customers have no token
        and cannot use these routes.

  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          example:
            message: "Missing or invalid API key"
    TooManyRequests:
      description: Rate limit exceeded (100 requests per minute per API key)
      headers:
        Retry-After:
          description: Number of seconds to wait before sending another request
          schema:
            type: integer
            example: 42
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitError'
          example:
            message: "Too many requests"
            retryAfter: 42

  schemas:
    WorkerSummary:
      type: object
      required: [id, name, jobType, location, rating, ratePerHour]
      properties:
        id:
          type: string
          example: "wk_1042"
        name:
          type: string
          example: "James Otieno"
        jobType:
          type: string
          enum: [electrician, plumber, handyman]
          example: "electrician"
        location:
          type: string
          example: "Nairobi, Upper Hill"
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 5
          example: 4.8
        ratePerHour:
          type: number
          format: float
          example: 800

    WorkerProfile:
      allOf:
        - $ref: '#/components/schemas/WorkerSummary'
        - type: object
          required: [experienceYears, reviews]
          properties:
            experienceYears:
              type: integer
              example: 6
            reviews:
              type: array
              items:
                type: object
                required: [author, comment, rating]
                properties:
                  author:
                    type: string
                    example: "Grace M."
                  comment:
                    type: string
                    example: "Fixed our wiring fault quickly."
                  rating:
                    type: integer
                    minimum: 1
                    maximum: 5
                    example: 5

    BookingRequest:
      type: object
      required: [workerId, jobType, location, scheduledFor, requestedBy]
      properties:
        workerId:
          type: string
          example: "wk_1042"
        jobType:
          type: string
          enum: [electrician, plumber, handyman]
          example: "electrician"
        location:
          type: string
          example: "Nairobi Hospital, Ward 4"
        scheduledFor:
          type: string
          format: date-time
          example: "2026-09-15T09:00:00Z"
        requestedBy:
          type: string
          description: Name or department of the hospital-side requester
          example: "HospitalQ Facilities Desk"

    Booking:
      type: object
      required: [id, workerId, jobType, location, scheduledFor, status, createdAt]
      properties:
        id:
          type: string
          description: Randomly generated booking id
          example: "bk_9f2a41c7d3b8e605"
        workerId:
          type: string
          example: "wk_1042"
        jobType:
          type: string
          enum: [electrician, plumber, handyman]
          example: "electrician"
        location:
          type: string
          example: "Nairobi Hospital, Ward 4"
        scheduledFor:
          type: string
          format: date-time
          example: "2026-09-15T09:00:00Z"
        status:
          type: string
          enum: [pending, in_progress, completed, cancelled]
          example: "pending"
        createdAt:
          type: string
          format: date-time
          example: "2026-09-07T08:00:00Z"

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "BOOKING_NOT_FOUND"
        message:
          type: string
          example: "No booking found with id bk_9f2a41c7d3b8e605"

    AuthError:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: "Missing or invalid API key"

    RateLimitError:
      type: object
      required: [message, retryAfter]
      properties:
        message:
          type: string
          example: "Too many requests"
        retryAfter:
          type: integer
          description: Seconds until the rate-limit window resets
          example: 42

    StaffLoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: "james" }
        password: { type: string, format: password }

    StaffLoginResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string, description: Signed session token }
        user:
          type: object
          properties:
            name: { type: string, example: "James Otieno" }
            role: { type: string, enum: [admin, fundi] }

    StaffCreateRequest:
      type: object
      required: [username, displayName, role, password]
      properties:
        username:
          type: string
          description: 3-50 letters, numbers, dots, dashes or underscores
          example: "james"
        displayName: { type: string, maxLength: 60, example: "James Otieno" }
        role: { type: string, enum: [admin, fundi] }
        password: { type: string, format: password, minLength: 8, maxLength: 100 }

    ActivityEntry:
      type: object
      properties:
        id: { type: integer }
        product_id: { type: integer }
        product_name: { type: string, nullable: true, example: "Laptop" }
        quantity:
          type: integer
          description: Positive = taken, negative = returned
          example: 2
        who: { type: string, example: "James Otieno" }
        created_at: { type: string, format: date-time }

    InventoryItem:
      type: object
      required: [product_id, name, category, quantity, taken, mine, status]
      properties:
        product_id: { type: integer, example: 18 }
        name: { type: string, example: "Laptop" }
        category: { type: string, example: "Electronics" }
        quantity:
          type: integer
          description: Left to take (partner stock minus what staff hold)
          example: 7
        taken:
          type: integer
          description: How many staff hold in total
          example: 2
        mine:
          type: integer
          description: How many the signed-in person holds
          example: 2
        status: { type: string, enum: [in_stock, low_stock, out_of_stock] }

    InventoryResponse:
      type: object
      required: [data, stale, asOf]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/InventoryItem' }
        stale:
          type: boolean
          description: True when live partner data was unavailable and a saved copy is shown
        asOf: { type: string, format: date-time }

    TakeReturnRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: integer, example: 18 }
        quantity: { type: integer, minimum: 1, maximum: 100, example: 2 }
